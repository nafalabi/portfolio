name: Tag-Driven Release & GitHub Pages Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_worker_deploy:
        description: "Force worker deploy even if no changes"
        type: boolean
        default: false

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      worker_changed: ${{ steps.filter.outputs.worker }}
      web_changed: ${{ steps.filter.outputs.web }}
      prev_tag: ${{ steps.prev-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: prev-tag
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then PREV=$(git rev-list --max-parents=0 HEAD); fi
          echo "tag=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev-tag.outputs.tag }}
          filters: |
            worker:
              - 'packages/worker/**'
              - '.github/workflows/deploy-page.yml'
            web:
              - 'packages/web/**'
              - '.github/workflows/deploy-page.yml'

  test-and-deploy-worker:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' || inputs.force_worker_deploy == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Install Dependencies
        run: |
          npm i -g yarn
          yarn install --frozen-lockfile --ignore-engines
      - name: Lint worker
        run: yarn workspace worker lint
      - name: Test worker
        run: yarn workspace worker test
      - name: Patch wrangler.jsonc from secrets
        env:
          WORKER_KV_NAMESPACE_ID: ${{ secrets.WORKER_KV_NAMESPACE_ID }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_FROM_EMAIL: ${{ secrets.MAILGUN_FROM_EMAIL }}
          CV_DRIVE_URL: ${{ secrets.CV_DRIVE_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          CV_BLOCKED_DOMAINS: ${{ secrets.CV_BLOCKED_DOMAINS }}
          CV_RATE_LIMIT_MAX: ${{ secrets.CV_RATE_LIMIT_MAX }}
          CV_RATE_LIMIT_WINDOW_SECONDS: ${{ secrets.CV_RATE_LIMIT_WINDOW_SECONDS }}
        run: node ./scripts/ci/patch-wrangler.mjs
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: deploy
          secrets: |-
            MAILGUN_API_KEY
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      - name: Summarize worker deploy
        run: |
          echo "### Worker :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Prev tag: \`${{ needs.detect-changes.outputs.prev_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Worker changed: \`${{ needs.detect-changes.outputs.worker_changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed: \`${{ steps.deploy.outputs.deployment-url }}\`" >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: |
          npm i -g yarn
          yarn install --frozen-lockfile --ignore-engines

      - name: Build with Vite SSG
        run: yarn workspace web build

      - name: Optimize Images
        run: yarn workspace web optimize

      - name: Setup CNAME
        run: echo "nandaabi.my.id" > ./packages/web/dist/CNAME

      - name: Deploy to Target Repository (nafalabi/nafalabi.github.io)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: nafalabi/nafalabi.github.io
          publish_branch: main
          publish_dir: ./packages/web/dist
          cname: nandaabi.my.id

  create-release:
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release in Portfolio
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
