name: Tag-Driven Release & GitHub Pages Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: |
          npm i -g yarn
          yarn install --frozen-lockfile --ignore-engines

      - name: Build with Vite SSG
        run: yarn build

      - name: Optimize Images
        run: yarn optimize

      - name: Setup CNAME
        run: echo "nandaabi.my.id" > ./dist/CNAME

      - name: Deploy to Target Repository (nafalabi/nafalabi.github.io)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: nafalabi/nafalabi.github.io
          publish_branch: main
          publish_dir: ./dist
          cname: nandaabi.my.id

  create-release:
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release in Portfolio
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
