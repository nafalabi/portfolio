name: Tag-Driven Release & GitHub Pages Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_worker_deploy:
        description: "Force worker deploy even if no changes"
        type: boolean
        default: false

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      worker_changed: ${{ steps.filter.outputs.worker }}
      web_changed: ${{ steps.filter.outputs.web }}
      prev_tag: ${{ steps.prev-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: prev-tag
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then PREV=$(git rev-list --max-parents=0 HEAD); fi
          echo "tag=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev-tag.outputs.tag }}
          filters: |
            worker:
              - 'packages/worker/**'
              - '.github/workflows/deploy-page.yml'
            web:
              - 'packages/web/**'
              - '.github/workflows/deploy-page.yml'

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: |
          npm i -g yarn
          yarn install --frozen-lockfile --ignore-engines

      - name: Build with Vite SSG
        run: yarn workspace web build

      - name: Optimize Images
        run: yarn workspace web optimize

      - name: Setup CNAME
        run: echo "nandaabi.my.id" > ./packages/web/dist/CNAME

      - name: Deploy to Target Repository (nafalabi/nafalabi.github.io)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: nafalabi/nafalabi.github.io
          publish_branch: main
          publish_dir: ./packages/web/dist
          cname: nandaabi.my.id

  create-release:
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release in Portfolio
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
